[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aarch64-autopilot"
version = "0.1.0"
description = "Quality-gated, evidence-producing AI inference optimization for Arm64 CPUs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "AArch64 Autopilot contributors" }]
keywords = ["arm64", "aarch64", "llama.cpp", "kleidiai", "inference", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.27,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
a64pilot = "a64pilot.cli:app"

[project.urls]
Repository = "https://github.com/xiaodouzi666/AAutopilot"
Competition = "https://arm-ai-optimization-challenge.devpost.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/a64pilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
