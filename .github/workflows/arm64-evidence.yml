name: Arm64 evidence pipeline

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per held-out case
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  push:
    branches:
      - main
    paths-ignore:
      - "artifacts/**"
      - "**/*.md"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: arm64-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-evidence:
    # GitHub's official runner reference lists ubuntu-24.04-arm as the standard
    # Arm64 Linux label for public repositories:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-24.04-arm
    # The supporting protocol matrix has its own 20-minute hard budget.  Keep a
    # separate outer margin for setup, formal A0-A4 rows, rendering, and upload.
    timeout-minutes: 240
    env:
      A64PILOT_CI: "1"
      BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '1' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assert the evidence target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) printf 'Expected Arm64 runner, found %s\n' "$(uname -m)" >&2; exit 2 ;;
          esac
          lscpu
          df -h .

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6 peeled commit
        with:
          version: "0.8.11"
          enable-cache: false

      - name: Install native dependencies
        run: scripts/install-system-deps.sh

      - name: Sync locked Python environment
        run: uv sync --frozen --extra dev --no-editable --reinstall-package aarch64-autopilot

      - name: Run source, schema, quality-data, and fixture gates
        env:
          # The committed screenshot set belongs to the prior published run and is verified
          # before this job replaces working-tree evidence with a new measurement session.
          A64PILOT_VERIFY_COMMITTED_ASSETS: "1"
        run: make verify-source

      - name: Start a clean target-evidence session
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # The committed prior-run assets were checked above. Remove only explicit
          # run-scoped outputs before any current-run capture can observe stale evidence.
          # This step is unconditional so an early source-gate failure cannot upload the
          # checkout's prior report under the new run ID. Keep deterministic source fixtures.
          rm -rf artifacts-public
          rm -rf \
            artifacts/raw \
            artifacts/performance-probes-raw \
            artifacts/a4 \
            artifacts/figures \
            artifacts/runtime \
            artifacts/screenshots \
            artifacts/submission \
            artifacts/tmp
          rm -f \
            artifacts/performance-probes.json \
            artifacts/system-info.json \
            artifacts/system-info.md \
            artifacts/build-manifest.json \
            artifacts/build-toolchain.json \
            artifacts/cmake-generic-cache.txt \
            artifacts/cmake-generic-flags.txt \
            artifacts/cmake-kleidiai-cache.txt \
            artifacts/cmake-kleidiai-flags.txt \
            artifacts/model-manifest.json \
            artifacts/search-plan.json \
            artifacts/a4-frozen-policy.json \
            artifacts/cascade-status.json \
            artifacts/quality-results.json \
            artifacts/quality-summary.json \
            artifacts/optimized-profile.yaml \
            artifacts/benchmark-results.csv \
            artifacts/benchmark-results.json \
            artifacts/ablation-results.csv \
            artifacts/claims.json \
            artifacts/report-data.json \
            artifacts/report-integrity.json \
            artifacts/report.html \
            artifacts/report.md \
            artifacts/evidence-index.json \
            artifacts/devpost-writeup-final.md \
            artifacts/submission-checklist.md \
            artifacts/video-script-final.md
          find artifacts -maxdepth 1 -type f -name 'quality-a*.json' -delete
          find artifacts -maxdepth 1 -type f -name 'quality-kleidiai-*.json' -delete

      - name: Record target provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          make doctor
          uv run --frozen --no-editable python - <<'PY'
          from pathlib import Path
          from a64pilot.schemas import SystemInfo

          info = SystemInfo.model_validate_json(
              Path("artifacts/system-info.json").read_text(encoding="utf-8")
          )
          assert info.schema_version == "2.0.0"
          assert info.architecture == "aarch64"
          assert info.operating_system.lower() == "linux"
          assert info.real_benchmark_eligible
          print(
              "target provenance:",
              info.cpu_model,
              info.distribution.pretty_name if info.distribution else "distribution-not-exposed",
              f"physical_cores={info.physical_cores}",
              f"memory_bytes={info.memory_bytes}",
              f"compiler={info.tool_versions.get('compiler')}",
              f"sockets={info.sockets}",
              f"numa_nodes={info.numa_nodes}",
              "caches=" + ",".join(cache.name for cache in info.cache_layout),
              "limitations="
              + ",".join(item.code for item in info.provenance_limitations),
              f"status={info.target_provenance_status}",
          )
          PY

      - name: Build same-commit generic and KleidiAI CPU backends
        run: make build JOBS=4

      - name: Download and verify the minimum official model set
        run: |
          make models MODEL_FLAGS=--minimum
          make verify-models
          df -h .

      - name: Run a real dual-backend smoke case
        # `benchmark fair --limit 1` records split=micro, so it cannot be
        # mixed into the complete 20-case held-out A1/A2 claim below.
        run: make smoke

      - name: Run bounded micro, startup, token, and p1/p2 probes
        timeout-minutes: 25
        run: make probes PROBE_FLAGS="--repetitions 3 --max-minutes 20"

      - name: Run the bounded real benchmark
        timeout-minutes: 85
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$BENCHMARK_REPETITIONS" in
            1|2|3) ;;
            *) printf 'Invalid repetition count: %s\n' "$BENCHMARK_REPETITIONS" >&2; exit 2 ;;
          esac
          uv run --frozen --no-editable a64pilot benchmark all \
            --quick \
            --formal-max-minutes 35 \
            --repetitions "$BENCHMARK_REPETITIONS"

      - name: Select only quality-feasible measured rows
        run: make select

      - name: Calibrate, freeze, and held-out gate the A4 cascade
        # A measured gate rejection is an honest result and exits zero with A3 as
        # the shipping fallback. Missing models/evidence, an invalid freeze, or an
        # incomplete 40/20 run exits nonzero and stops the evidence pipeline.
        timeout-minutes: 65
        run: >-
          make a4
          A4_CALIBRATION_FLAGS="--max-minutes 30"
          A4_HELD_OUT_FLAGS="--max-minutes 30"

      - name: Render the strict report and Devpost materials
        run: |
          make report
          uv run --frozen --no-editable python scripts/generate-submission-assets.py --quality-only
          make submission

      - name: Run full backend, claim, provenance, and source verification
        run: make verify

      - name: Capture validated target-device demo receipt
        run: uv run --frozen --no-editable python scripts/capture-arm-target-demo.py

      - name: Render target-device demo video from validated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends \
            espeak-ng \
            ffmpeg \
            fonts-dejavu-core \
            imagemagick
          espeak-ng --version
          uv run --frozen --no-editable python scripts/render-demo-video.py

      - name: Rebuild current-run screenshots and bundle index
        run: |
          uv run --frozen --no-editable python scripts/generate-submission-assets.py \
            --video artifacts/submission/a64pilot-demo-final.mp4
          uv run --frozen --no-editable python scripts/generate-submission-assets.py \
            --current-run-index-only
          uv run --frozen --no-editable python scripts/generate-submission-assets.py --verify-only
          uv run --frozen --no-editable python scripts/check-final-placeholders.py

      - name: Build a sanitized public evidence bundle
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # Natural-voice public derivatives are produced after CI from the attested video.
          # Never let a manifest retained from an earlier checkout enter a new evidence subject.
          rm -f artifacts/submission/a64pilot-demo-natural-voice.manifest.json
          if [[ "${{ job.status }}" != "success" ]]; then
            # A failed run must never republish the checkout's prior-run index.
            rm -f artifacts/evidence-index.json
          fi
          uv run --frozen --no-editable python scripts/redact-artifacts.py \
            --output artifacts-public artifacts

      - name: Verify the sanitized bundle is clean
        if: always()
        run: uv run --frozen --no-editable python scripts/redact-artifacts.py --check artifacts-public

      - name: Verify sanitized A0-A4 evidence derivation
        if: success()
        run: >-
          uv run --frozen --no-editable a64pilot verify-public-derivation
          --artifacts-dir artifacts-public
          --private-artifacts artifacts

      - name: Replay sanitized probe semantics
        if: success()
        run: >-
          uv run --frozen --no-editable a64pilot verify-probes
          --artifacts-dir artifacts-public
          --manifest-only

      - name: Verify sanitized report integrity
        if: success()
        run: >-
          uv run --frozen --no-editable a64pilot verify-report-integrity
          --artifacts-dir artifacts-public

      - name: Package the verified public evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf aarch64-autopilot-evidence.tar.gz -C artifacts-public .
          sha256sum aarch64-autopilot-evidence.tar.gz | tee evidence-bundle.sha256

      - name: Sign the Arm64 evidence provenance
        if: success()
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: aarch64-autopilot-evidence.tar.gz

      - name: Add report to the workflow summary
        if: success()
        shell: bash
        run: |
          if [[ -f artifacts-public/report.md ]]; then
            cat artifacts-public/report.md >>"$GITHUB_STEP_SUMMARY"
          else
            printf 'Arm64 evidence pipeline did not reach report generation.\n' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized evidence without writing back to Git
        # Never upload a partial destination or content that failed the redaction check.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-autopilot-arm64-${{ github.run_id }}
          path: artifacts-public/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload the signed evidence subject
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-autopilot-attested-evidence-${{ github.run_id }}
          path: |
            aarch64-autopilot-evidence.tar.gz
            evidence-bundle.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
